modules:
  icmp:
    prober: icmp
    timeout: 5s
    icmp:
      preferred_ip_protocol: ip4
      ip_protocol_fallback: false

  tcp_connect:
    prober: tcp
    timeout: 5s
    tcp:
      preferred_ip_protocol: ip4
      ip_protocol_fallback: false

  http_2xx:
    prober: http
    timeout: 8s
    http:
      valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
      valid_status_codes: [200, 301, 302]
      method: GET
      follow_redirects: true
      preferred_ip_protocol: ip4
      ip_protocol_fallback: false
      fail_if_not_ssl: false
      tls_config:
        insecure_skip_verify: true

  # Public HTTPS: final 200, non-empty body, valid TLS, no Kong no-route, no Cloudflare 502/52x.
  http_website:
    prober: http
    timeout: 15s
    http:
      valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
      valid_status_codes: [200]
      method: GET
      follow_redirects: true
      preferred_ip_protocol: ip4
      ip_protocol_fallback: false
      fail_if_not_ssl: true
      tls_config:
        insecure_skip_verify: false
      headers:
        User-Agent: "kvm-monitoring-blackbox/1.0"
      fail_if_body_not_matches_regexp:
        - ".+"
      fail_if_body_matches_regexp:
        - '(?i)no Route matched'
        - '(?i)no Route and no Service'
        - '(?i)cf-error-details'
        - '(?i)cf-error-code'
        - '(?i)Error code 50[2-4]'
        - '(?i)Error code 52[0-7]'
        - '(?i)Error code 530'
        - '(?i)<title>[^<]*(?:502: )?Bad [Gg]ateway'
        - '(?i)<title>[^<]*52[0-7]:'
        - '(?i)<title>[^<]*530:'
        - '(?i)Web server is down'
        - '(?i)Origin is unreachable'
        - '(?i)A timeout occurred'

  # Service API (not a web-app/frontend). GET / returning JSON
  # {"detail":"Not Found"} with 200 or FastAPI-style 404 is healthy.
  http_website_api:
    prober: http
    timeout: 15s
    http:
      valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
      valid_status_codes: [200, 404]
      method: GET
      follow_redirects: true
      preferred_ip_protocol: ip4
      ip_protocol_fallback: false
      fail_if_not_ssl: true
      tls_config:
        insecure_skip_verify: false
      headers:
        User-Agent: "kvm-monitoring-blackbox/1.0"
      fail_if_body_not_matches_regexp:
        - '\{'
      fail_if_body_matches_regexp:
        - '(?i)no Route matched'
        - '(?i)no Route and no Service'
        - '(?i)cf-error-details'
        - '(?i)cf-error-code'
        - '(?i)Error code 50[2-4]'
        - '(?i)Error code 52[0-7]'
        - '(?i)Error code 530'
        - '(?i)<title>[^<]*(?:502: )?Bad [Gg]ateway'
        - '(?i)<title>[^<]*52[0-7]:'
        - '(?i)<title>[^<]*530:'
        - '(?i)Web server is down'
        - '(?i)Origin is unreachable'
        - '(?i)A timeout occurred'

  # Origin 27.72.98.70 (Kong) uses self-signed CN=localhost.
  http_website_origin:
    prober: http
    timeout: 15s
    http:
      valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
      valid_status_codes: [200]
      method: GET
      follow_redirects: true
      preferred_ip_protocol: ip4
      ip_protocol_fallback: false
      fail_if_not_ssl: false
      tls_config:
        insecure_skip_verify: true
