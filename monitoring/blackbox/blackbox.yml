        - '(?i)Error code 50[2-4]'
        - '(?i)Error code 52[0-7]'
        - '(?i)Error code 530'
        - '(?i)<title>[^<]*(?:502: )?Bad [Gg]ateway'
        - '(?i)<title>[^<]*52[0-7]:'
        - '(?i)<title>[^<]*530:'
        - '(?i)Web server is down'
        - '(?i)Origin is unreachable'
        - '(?i)A timeout occurred'

  http_website_plain:
    prober: http
    timeout: 15s
    http:
      valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
      valid_status_codes: [200]
      method: GET
