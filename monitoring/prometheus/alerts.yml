groups:
  - name: recording
    interval: 15s
    rules:
      - record: vm:cpu_usage_ratio
        expr: |
          label_replace(
            rate(libvirt_domain_info_cpu_time_seconds_total[2m])
            / clamp_min(libvirt_domain_info_virtual_cpus, 1),
            "vm", "$1", "domain", "(.*)"
          )

      - record: vm:rss_bytes
        expr: |
          label_replace(libvirt_domain_memory_stats_rss_bytes, "vm", "$1", "domain", "(.*)")

      - record: guest:root_disk_used_ratio
        expr: |
          1 - (
            node_filesystem_avail_bytes{role="guest",fstype!~"tmpfs|overlay|squashfs|nsfs",mountpoint="/"}
            /
            node_filesystem_size_bytes{role="guest",fstype!~"tmpfs|overlay|squashfs|nsfs",mountpoint="/"}
          )

      - record: guest:mem_used_ratio
        expr: |
          1 - (
            node_memory_MemAvailable_bytes{role="guest"}
            /
            node_memory_MemTotal_bytes{role="guest"}
          )

      - record: physical:root_disk_used_ratio
        expr: |
          1 - (
            node_filesystem_avail_bytes{role="physical",fstype!~"tmpfs|overlay|squashfs|nsfs",mountpoint="/"}
            /
            node_filesystem_size_bytes{role="physical",fstype!~"tmpfs|overlay|squashfs|nsfs",mountpoint="/"}
          )

      - record: physical:mem_used_ratio
        expr: |
          1 - (
            node_memory_MemAvailable_bytes{role="physical"}
            /
            node_memory_MemTotal_bytes{role="physical"}
          )

      # Prefer Intel/AMD package (coretemp, dell_smm, x86_pkg). ARM/SoC falls back to acpitz.
      - record: physical:cpu_temp_celsius
        expr: |
          max by (host, instance, job, role) (
            node_hwmon_temp_celsius{chip=~".*(coretemp|dell_smm).*"}
            or node_thermal_zone_temp{type="x86_pkg_temp"}
          )
          or
          max by (host, instance, job, role) (
            node_thermal_zone_temp{type="acpitz"}
            or node_hwmon_temp_celsius{chip=~"thermal_thermal_zone.*"}
          )

      - record: physical:nvme_temp_celsius
        expr: |
          max by (host, instance, job, role) (
            node_hwmon_temp_celsius{chip=~"nvme_.*"}
          )

      - record: physical:temp_max_celsius
        expr: |
          max by (host, instance, job, role) (
            (node_hwmon_temp_celsius > 0) < 120
          )

      - record: aibox:mem_used_ratio
        expr: megbox_memory_used_mib / clamp_min(megbox_memory_size_mib, 1)

      - record: aibox:storage_used_ratio
        expr: megbox_storage_used_mib / clamp_min(megbox_storage_size_mib, 1)

      - record: oraybox:lan_link_up
        expr: |
          max by (host, ip, instance, job, role, port, vendor) (
            oraybox_lan_info{link="up"}
          )
          or
          max by (host, ip, instance, job, role, port, vendor) (
            oraybox_lan_info * 0
          )

      # 2 = Cloudflare proxy (valid), 1 = A is origin 27.72.98.70 (yellow), 0 = DNS fail
      - record: website:dns_path
        expr: |
          (probe_dns_query_succeeded{job="blackbox-dns-website"} == 1)
          *
          (2 - probe_success{job="blackbox-dns-website"})

  - name: host
    rules:
      - alert: HostSwapHigh
        expr: |
          (node_memory_SwapTotal_bytes{role="hypervisor"} > 0)
          and
          ((1 - node_memory_SwapFree_bytes{role="hypervisor"} / node_memory_SwapTotal_bytes{role="hypervisor"}) > 0.8)
        for: 15m
        labels:
          severity: warning
          class: capacity
          vm: hypervisor
        annotations:
          summary: "Host swap > 80%"
          description: "Hygiene. Critical HostSwapFull only when MemAvailable is also under 4 GiB (stall / OOM path)."

      - alert: HostSwapFull
        expr: |
          (node_memory_SwapTotal_bytes{role="hypervisor"} > 0)
          and
          ((1 - node_memory_SwapFree_bytes{role="hypervisor"} / node_memory_SwapTotal_bytes{role="hypervisor"}) > 0.8)
          and
          (node_memory_MemAvailable_bytes{role="hypervisor"} < 4 * 1024 * 1024 * 1024)
        for: 10m
        labels:
          severity: critical
          class: capacity
          vm: hypervisor
        annotations:
          summary: "Host swap > 80% and MemAvailable < 4 GiB"
          description: "RAM and swap are both exhausted. VMs may stall, hang, or get killed. MemAvailable {{ $value | humanize1024 }}B."

      - alert: HostMemLow
        expr: node_memory_MemAvailable_bytes{role="hypervisor"} < 4 * 1024 * 1024 * 1024
        for: 5m
        labels:
          severity: critical
          class: capacity
          vm: hypervisor
        annotations:
          summary: "Host available RAM < 4 GiB"
          description: "MemAvailable is {{ $value | humanize1024 }}B on the KVM host. Stall / OOM risk for guests."

      - alert: HostLoadHigh
        expr: node_load15{role="hypervisor"} / count without(cpu, mode) (node_cpu_seconds_total{role="hypervisor",mode="idle"}) > 1.2
        for: 10m
        labels:
          severity: warning
          vm: hypervisor
        annotations:
          summary: "Host load15 above CPU count"
          description: "load15/CPU = {{ $value | humanize }}."

      - alert: HostDataDiskSpace
        expr: (node_filesystem_avail_bytes{role="hypervisor",mountpoint="/mnt/data"} / node_filesystem_size_bytes{role="hypervisor",mountpoint="/mnt/data"}) < 0.2
        for: 5m
        labels:
          severity: warning
          vm: hypervisor
        annotations:
          summary: "/mnt/data < 20% free"
          description: "VM disks live on /mnt/data. Free ratio {{ $value | humanizePercentage }}."

      - alert: HostDataDiskSpaceCritical
        expr: (node_filesystem_avail_bytes{role="hypervisor",mountpoint="/mnt/data"} / node_filesystem_size_bytes{role="hypervisor",mountpoint="/mnt/data"}) < 0.1
        for: 5m
        labels:
          severity: critical
          class: capacity
          vm: hypervisor
        annotations:
          summary: "/mnt/data < 10% free"
          description: "Host data disk almost full. VM disks cannot grow. Free ratio {{ $value | humanizePercentage }}."

      - alert: HostRootDiskSpace
        expr: (node_filesystem_avail_bytes{role="hypervisor",mountpoint="/"} / node_filesystem_size_bytes{role="hypervisor",mountpoint="/"}) < 0.15
        for: 5m
        labels:
          severity: warning
          vm: hypervisor
        annotations:
          summary: "Host / < 15% free"

      - alert: LibvirtExporterDown
        expr: up{job="libvirt"} == 0
        for: 2m
        labels:
          severity: critical
          class: down
          vm: hypervisor
        annotations:
          summary: "libvirt-exporter is down"
          description: "Cannot see guest power state. Treat as hypervisor visibility loss."

      - alert: NodeExporterHostDown
        expr: up{job="host"} == 0
        for: 2m
        labels:
          severity: critical
          class: down
          vm: hypervisor
        annotations:
          summary: "Host node_exporter is down"
          description: "Hypervisor OS metrics missing. Confirm the KVM host is still up."

  - name: vms
    rules:
      - alert: VMDown
        expr: libvirt_domain_info_state{vm=~"faceid|wiseeye|kong-gateway|chebichat"} != 1
        for: 1m
        labels:
          severity: critical
          class: down
        annotations:
          summary: "VM {{ $labels.vm }} is not running"
          description: "libvirt state code {{ $value }} (1=running). Production VM should be up."

      - alert: VMDownOptional
        expr: libvirt_domain_info_state{vm=~"unilever|nx-vms"} != 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "VM {{ $labels.vm }} is not running"
          description: "Optional guest (shut off is expected). nx-vms IP 10.168.1.106 is now physical host ght-elitedesk."

      - alert: GuestUnreachable
        expr: probe_success{job="blackbox-icmp",role="guest",vm=~"faceid|wiseeye|kong-gateway|chebichat"} == 0
        for: 2m
        labels:
          severity: critical
          class: down
        annotations:
          summary: "ICMP fail: {{ $labels.vm }}"
          description: "Guest does not answer ping from the host."

      - alert: SSHDown
        expr: |
          probe_success{job="blackbox-ssh",vm=~"faceid|wiseeye|kong-gateway|chebichat"} == 0
          and on(vm) probe_success{job="blackbox-icmp",role="guest"} == 1
        for: 3m
        labels:
          severity: warning
          class: service
        annotations:
          summary: "SSH :22 closed on {{ $labels.vm }}"

      - alert: AppHTTPDown
        expr: |
          (
            probe_success{job="blackbox-http",role="guest"} == 0
            and on(vm) probe_success{job="blackbox-icmp",role="guest"} == 1
          )
          or
          (
            probe_success{job="blackbox-http",role="physical"} == 0
            and on(host) probe_success{job="blackbox-icmp",role="physical"} == 1
          )
        for: 2m
        labels:
          severity: critical
          class: service
        annotations:
          summary: "HTTP down: {{ $labels.app }} on {{ $labels.vm }}"
          description: "App HTTP failed while the machine still answers ping."

      - alert: GuestNodeExporterDown
        expr: |
          up{job="nodes",vm=~"faceid|wiseeye|kong-gateway|chebichat"} == 0
          and on(vm) probe_success{job="blackbox-icmp",role="guest"} == 1
        for: 3m
        labels:
          severity: warning
          class: service
        annotations:
          summary: "node_exporter down on {{ $labels.vm }}"
          description: "Guest OS metrics missing. VM still answers ping (check ICMP/libvirt)."

      - alert: GuestDiskFull
        expr: guest:root_disk_used_ratio > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.vm }} root disk > 85%"
          description: "Used ratio {{ $value | humanizePercentage }}."

      - alert: GuestDiskFullCritical
        expr: guest:root_disk_used_ratio > 0.95
        for: 2m
        labels:
          severity: critical
          class: capacity
        annotations:
          summary: "{{ $labels.vm }} root disk > 95%"

      - alert: GuestMemHigh
        expr: guest:mem_used_ratio > 0.9
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.vm }} RAM > 90%"
          description: "Guest MemAvailable is low ({{ $value | humanizePercentage }} used)."

      - alert: GuestCPUHigh
        expr: vm:cpu_usage_ratio > 0.9
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.vm }} vCPU > 90%"
          description: "libvirt CPU time / vCPU count = {{ $value | humanizePercentage }}."

      - alert: InfraUnreachable
        expr: probe_success{job="blackbox-icmp",role="infra"} == 0
        for: 2m
        labels:
          severity: critical
          class: down
        annotations:
          summary: "Infra ping fail: {{ $labels.vm }}"
          description: "Gateway or NAS does not answer ping from the hypervisor."

  - name: physical
    rules:
      - alert: PhysicalUnreachable
        expr: probe_success{job="blackbox-icmp",role="physical"} == 0
        for: 2m
        labels:
          severity: critical
          class: down
        annotations:
          summary: "ICMP fail: {{ $labels.host }}"
          description: "Physical host {{ $labels.host }} ({{ $labels.instance }}) does not answer ping."

      - alert: PhysicalSSHDown
        expr: |
          probe_success{job="blackbox-ssh",role="physical"} == 0
          and on(host) probe_success{job="blackbox-icmp",role="physical"} == 1
        for: 3m
        labels:
          severity: warning
          class: service
        annotations:
          summary: "SSH :22 closed on {{ $labels.host }}"

      - alert: PhysicalNodeExporterDown
        expr: |
          up{job="physical"} == 0
          and on(host) probe_success{job="blackbox-icmp",role="physical"} == 1
        for: 3m
        labels:
          severity: warning
          class: service
        annotations:
          summary: "node_exporter down on {{ $labels.host }}"

      - alert: PhysicalDiskFull
        expr: physical:root_disk_used_ratio > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.host }} root disk > 85%"
          description: "Used ratio {{ $value | humanizePercentage }}."

      - alert: PhysicalDiskFullCritical
        expr: physical:root_disk_used_ratio > 0.95
        for: 2m
        labels:
          severity: critical
          class: capacity
        annotations:
          summary: "{{ $labels.host }} root disk > 95%"

      - alert: PhysicalMemHigh
        expr: physical:mem_used_ratio > 0.9
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.host }} RAM > 90%"

      - alert: PhysicalSwapFull
        expr: |
          (node_memory_SwapTotal_bytes{role="physical"} > 0)
          and
          ((1 - node_memory_SwapFree_bytes{role="physical"} / node_memory_SwapTotal_bytes{role="physical"}) > 0.8)
        for: 15m
        labels:
          severity: warning
          class: capacity
        annotations:
          summary: "{{ $labels.host }} swap > 80%"

      - alert: PhysicalCPUTempHigh
        expr: physical:cpu_temp_celsius > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.host }} CPU {{ $value | humanize }}°C"
          description: "CPU/package temperature above 80°C."

      # ght-faceid-server sat at 74–79°C for days while one migrating thread
      # held a core (session libvirtd). The 80°C rule did not stay firing.
      - alert: HostCPUTempSustained
        expr: physical:cpu_temp_celsius{host="ght-faceid-server"} > 70
        for: 30m
        labels:
          severity: warning
          class: capacity
        annotations:
          summary: "ght-faceid-server CPU {{ $value | humanize }}°C for 30m"
          description: "Package temperature above 70°C for 30 minutes. Check for a userspace thread pegged on one core, including a session libvirtd udev busy-loop."

      - alert: PhysicalCPUTempCritical
        expr: physical:cpu_temp_celsius > 90
        for: 2m
        labels:
          severity: critical
          class: capacity
        annotations:
          summary: "{{ $labels.host }} CPU {{ $value | humanize }}°C (critical)"
          description: "CPU/package temperature above 90°C. Thermal shutdown risk."

      - alert: PhysicalNVMeTempHigh
        expr: physical:nvme_temp_celsius > 70
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.host }} NVMe {{ $value | humanize }}°C"
          description: "NVMe composite/sensor temperature above 70°C."

      - alert: PhysicalNVMeTempCritical
        expr: physical:nvme_temp_celsius > 80
        for: 2m
        labels:
          severity: critical
          class: capacity
        annotations:
          summary: "{{ $labels.host }} NVMe {{ $value | humanize }}°C (critical)"
          description: "NVMe above 80°C. Throttle or drive failure risk."

      - alert: PhysicalTempMissing
        expr: |
          up{job=~"host|physical"} == 1
          unless on(host)
          physical:cpu_temp_celsius
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.host }} has no CPU temperature sensors"
          description: "node_exporter is up but coretemp/pkg/acpitz readings are missing."

  - name: aibox
    rules:
      - alert: AiBoxUnreachable
        expr: probe_success{job="blackbox-icmp",role="aibox"} == 0
        for: 2m
        labels:
          severity: critical
          class: down
        annotations:
          summary: "ICMP fail: {{ $labels.host }}"
          description: "Megvii AI Box {{ $labels.host }} ({{ $labels.instance }}) does not answer ping."

      - alert: AiBoxApiDown
        expr: |
          probe_success{job="blackbox-http",role="aibox"} == 0
          and on(host) probe_success{job="blackbox-icmp",role="aibox"} == 1
        for: 2m
        labels:
          severity: critical
          class: service
        annotations:
          summary: "MEGBOX API down: {{ $labels.host }}"
          description: "GET /v1/MEGBOX/devices is not HTTP 200 while the box still answers ping."

      - alert: AiBoxScrapeFailed
        expr: |
          up{job="aibox"} == 0
          and on(host) probe_success{job="blackbox-icmp",role="aibox"} == 1
        for: 3m
        labels:
          severity: warning
          class: service
        annotations:
          summary: "AI Box scrape failed: {{ $labels.host }}"
          description: "json_exporter could not collect hardwareStatus from {{ $labels.instance }}. Box still answers ping."

      - alert: AiBoxApiError
        expr: megbox_api_code != 0
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "MEGBOX API code {{ $value }} on {{ $labels.host }}"

      - alert: AiBoxCPUHigh
        expr: megbox_cpu_usage_percent > 80
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.host }} CPU {{ $value }}%"

      - alert: AiBoxCPUTempHigh
        expr: megbox_cpu_temp_celsius > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.host }} CPU {{ $value }}°C"

      - alert: AiBoxCPUTempCritical
        expr: megbox_cpu_temp_celsius > 90
        for: 2m
        labels:
          severity: critical
          class: capacity
        annotations:
          summary: "{{ $labels.host }} CPU {{ $value }}°C (critical)"

      - alert: AiBoxMemHigh
        expr: aibox:mem_used_ratio > 0.9
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.host }} RAM {{ $value | humanizePercentage }}"

      - alert: AiBoxStorageHigh
        expr: aibox:storage_used_ratio > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.host }} storage {{ $value | humanizePercentage }}"

      - alert: AiBoxStorageCritical
        expr: aibox:storage_used_ratio > 0.95
        for: 2m
        labels:
          severity: critical
          class: capacity
        annotations:
          summary: "{{ $labels.host }} storage {{ $value | humanizePercentage }} (critical)"

      - alert: AiBoxNtpFail
        expr: megbox_ntp_fail_count > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.host }} NTP fail count {{ $value }}"

  - name: oraybox
    rules:
      - alert: OrayboxUnreachable
        expr: probe_success{job="blackbox-icmp",role="oraybox"} == 0
        for: 2m
        labels:
          severity: critical
          class: down
        annotations:
          summary: "ICMP fail: {{ $labels.host }}"
          description: "Oraybox {{ $labels.host }} ({{ $labels.instance }}) does not answer ping."

      - alert: OrayboxApiDown
        expr: |
          probe_success{job="blackbox-http",role="oraybox"} == 0
          and on(host) probe_success{job="blackbox-icmp",role="oraybox"} == 1
        for: 2m
        labels:
          severity: warning
          class: service
        annotations:
          summary: "Oraybox API down: {{ $labels.host }}"
          description: "GET /cgi-bin/oraybox?_api=ether_status_get is not HTTP 200 while the switch still answers ping (CGI 500 on oraybox-10 is known)."

      - alert: OrayboxScrapeFailed
        expr: |
          up{job="oraybox"} == 0
          and on(host) probe_success{job="blackbox-icmp",role="oraybox"} == 1
          unless on(host) probe_success{job="blackbox-http",role="oraybox"} == 0
        for: 3m
        labels:
          severity: warning
          class: service
        annotations:
          summary: "Oraybox scrape failed: {{ $labels.host }}"
          description: "json_exporter could not collect LAN ether_status from {{ $labels.instance }}. Switch still answers ping."

      - alert: OrayboxApiError
        expr: oraybox_api_code != 0
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "Oraybox API code {{ $value }} on {{ $labels.host }}"

      - alert: OrayboxAllLanDown
        expr: |
          sum by (host) (oraybox:lan_link_up) == 0
          and on (host) up{job="oraybox"} == 1
        for: 5m
        labels:
          severity: critical
          class: down
        annotations:
          summary: "{{ $labels.host }} all LAN ports down"
          description: "ether_status_get succeeded but every LAN port reports link=down. Switching path is dead."

  - name: websites
    rules:
      - alert: WebsiteHTTPDown
        expr: probe_success{job="blackbox-http-website",role="website",kind=~"web|api"} == 0
        for: 2m
        labels:
          severity: critical
          class: service
        annotations:
          summary: "{{ $labels.kind }} down: {{ $labels.host }}"
          description: >-
            GET {{ $labels.instance }} failed for 2m
            (kind={{ $labels.kind }}: web=frontend/web-app requires HTTP 200 HTML;
            api=service API — JSON {"detail":"Not Found"} on GET / is healthy, not a missing SPA).
            Fail = empty body, Kong no-route, TLS, or Cloudflare 502/52x Bad gateway.
