# Alerts are visible in Prometheus /alerts and Grafana.
# Add a Telegram/email receiver here when a bot token is available.
route:
  receiver: default
  group_by: [alertname, vm]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity="critical"
      group_wait: 15s
      repeat_interval: 1h

receivers:
  - name: default

inhibit_rules:
  - source_matchers: [severity="critical"]
    target_matchers: [severity="warning"]
    equal: [alertname, vm]
