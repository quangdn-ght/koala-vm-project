# Bản Phase 0 — copy đè /home/ght/deploy/monitoring/alertmanager/alertmanager.yml
# khi bắt đầu Phase 0. Receiver keep tồn tại; production vẫn vào `default` (im lặng).
# Chỉ alert có label keep_test="true" mới webhook sang Keep.
#
# Rollback: git checkout -- alertmanager/alertmanager.yml && docker compose kill -s HUP alertmanager
# (Alertmanager reload config khi process nhận SIGHUP hoặc restart container)

route:
  receiver: default
  group_by: [alertname, vm, host]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - keep_test="true"
      receiver: keep
      group_wait: 5s
      group_interval: 1m
      repeat_interval: 1h
    - matchers:
        - severity="critical"
      group_wait: 15s
      repeat_interval: 1h
      receiver: default

receivers:
  - name: default
  - name: keep
    webhook_configs:
      - url: http://keep-backend:8080/alerts/event/prometheus
        send_resolved: true
        max_alerts: 0
        http_config:
          basic_auth:
            username: api_key
            password_file: /etc/alertmanager/keep_webhook_password
          follow_redirects: true

inhibit_rules:
  - source_matchers: [severity="critical"]
    target_matchers: [severity="warning"]
    equal: [alertname, vm, host]
