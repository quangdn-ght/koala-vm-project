# Overlay Keep vào project kvm-monitoring.
# KHÔNG chạy `docker compose up` trong thư mục keep/ — file này thiếu stack
# Prometheus/Grafana và không đọc monitoring/.env (lỗi KEEP_JWT_SECRET missing).
#
# Đúng:
#   bash /home/ght/deploy/monitoring/keep/up.sh up -d
# hoặc từ /home/ght/deploy/monitoring:
#   docker compose --env-file .env -f docker-compose.yml -f keep/docker-compose.yml up -d
#
# Image tag: KEEP_IMAGE_TAG (mặc định 0.54.2). Kéo thử trước khi up:
#   docker pull us-central1-docker.pkg.dev/keephq/keep/keep-api:${KEEP_IMAGE_TAG}
#   docker pull us-central1-docker.pkg.dev/keephq/keep/keep-ui:${KEEP_IMAGE_TAG}

name: kvm-monitoring

x-keep-env: &keep-common-env
  AUTH_TYPE: ${AUTH_TYPE:-DB}
  POSTHOG_DISABLED: "true"
  SENTRY_DISABLED: "true"
  KEEP_LIVE_DEMO_MODE: "false"
  KEEP_PULL_DATA_ENABLED: "false"

services:
  # Overlay: thêm password_file cho webhook Keep (merge volume theo dest).
  alertmanager:
    volumes:
      - ./alertmanager/keep_webhook_password:/etc/alertmanager/keep_webhook_password:ro

  keep-backend:
    image: us-central1-docker.pkg.dev/keephq/keep/keep-api:${KEEP_IMAGE_TAG:-0.54.2}
    container_name: keep-backend
    restart: unless-stopped
    environment:
      <<: *keep-common-env
      PORT: "8080"
      SECRET_MANAGER_TYPE: FILE
      SECRET_MANAGER_DIRECTORY: /state
      DATABASE_CONNECTION_STRING: sqlite:////state/db.sqlite3?check_same_thread=False
      KEEP_DEFAULT_USERNAME: ${KEEP_DEFAULT_USERNAME:-keep}
      KEEP_DEFAULT_PASSWORD: ${KEEP_DEFAULT_PASSWORD:?set KEEP_DEFAULT_PASSWORD in .env}
      KEEP_JWT_SECRET: ${KEEP_JWT_SECRET:?set KEEP_JWT_SECRET in .env}
      KEEP_DEFAULT_API_KEYS: ${KEEP_DEFAULT_API_KEYS:?set KEEP_DEFAULT_API_KEYS in .env}
      KEEP_PROVIDERS_DIRECTORY: /providers
      PUSHER_APP_ID: "1"
      PUSHER_APP_KEY: keepappkey
      PUSHER_APP_SECRET: ${KEEP_PUSHER_APP_SECRET:-keepappsecret}
      PUSHER_HOST: keep-websocket-server
      PUSHER_PORT: "6001"
      USE_NGROK: "false"
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus
      KEEP_METRICS: "true"
      LOG_LEVEL: INFO
    volumes:
      # Paths relative to monitoring/ (first -f compose file), not keep/.
      - ./keep/state:/state
      - ./keep/providers:/providers:ro
    ports:
      - "${KEEP_API_PORT:-8080}:8080"
    depends_on:
      - keep-websocket-server
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/docs', timeout=5)",
        ]
      interval: 15s
      timeout: 5s
      retries: 15
      start_period: 40s

  keep-frontend:
    image: us-central1-docker.pkg.dev/keephq/keep/keep-ui:${KEEP_IMAGE_TAG:-0.54.2}
    container_name: keep-frontend
    restart: unless-stopped
    environment:
      <<: *keep-common-env
      API_URL: http://keep-backend:8080
      NEXTAUTH_URL: ${KEEP_NEXTAUTH_URL:-http://10.168.1.2:3001}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?set NEXTAUTH_SECRET in .env}
      NEXT_PUBLIC_API_URL: ${KEEP_PUBLIC_API_URL:-http://10.168.1.2:8080}
      PUSHER_HOST: ${KEEP_PUSHER_HOST:-10.168.1.2}
      PUSHER_PORT: ${KEEP_WS_PORT:-6001}
      PUSHER_APP_KEY: keepappkey
    ports:
      - "${KEEP_UI_PORT:-3001}:3000"
    depends_on:
      keep-backend:
        condition: service_healthy

  keep-websocket-server:
    image: quay.io/soketi/soketi:1.4-16-debian
    container_name: keep-websocket
    restart: unless-stopped
    environment:
      SOKETI_USER_AUTHENTICATION_TIMEOUT: "3000"
      SOKETI_DEBUG: "0"
      SOKETI_DEFAULT_APP_ID: "1"
      SOKETI_DEFAULT_APP_KEY: keepappkey
      SOKETI_DEFAULT_APP_SECRET: ${KEEP_PUSHER_APP_SECRET:-keepappsecret}
    ports:
      - "${KEEP_WS_PORT:-6001}:6001"
      - "127.0.0.1:9601:9601"

# SQLite + secrets: bind ./keep/state (uid 1000 keep). Named volume was root-owned.
